[build]
  publish = "public"

[[redirects]]
  from = "/tickets"
  to = "https://shop.weeztix.com/8f00acf9-cd91-452a-ae22-7fa14a0a77bc"
  status = 302

[[redirects]]
  from = "/events"
  to = "https://shop.weeztix.com/8f00acf9-cd91-452a-ae22-7fa14a0a77bc"
  status = 302

[[redirects]]
  from = "/signup"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfkCK7nf1Eng3eyBghQrY6sk-PkRzoguNkHh3pbwtckFfwOeA/viewform"
  status = 302

[[redirects]]
  from = "/community"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfkCK7nf1Eng3eyBghQrY6sk-PkRzoguNkHh3pbwtckFfwOeA/viewform"
  status = 302

[[redirects]]
  from = "/join"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfkCK7nf1Eng3eyBghQrY6sk-PkRzoguNkHh3pbwtckFfwOeA/viewform"
  status = 302

[[redirects]]
  from = "/opendecks"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfkCK7nf1Eng3eyBghQrY6sk-PkRzoguNkHh3pbwtckFfwOeA/viewform"
  status = 302

[[redirects]]
  from = "/instagram"
  to = "https://www.instagram.com/sonic.tonic.collective/"
  status = 302

[[redirects]]
  from = "/youtube"
  to = "https://youtube.com/@sonic.tonic.collective"
  status = 302

[[redirects]]
  from = "/mixcloud"
  to = "https://mixcloud.com/sonictoniccollective"
  status = 302

[[redirects]]
  from = "/cookies"
  to = "/privacy"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://js.stripe.com; style-src 'unsafe-inline'; img-src 'self' data: https://*.stripe.com; font-src 'self'; connect-src 'self' https://api.stripe.com https://r.stripe.com https://m.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://buy.stripe.com; base-uri 'none'; form-action 'self' https://checkout.stripe.com https://buy.stripe.com; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), microphone=(), usb=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
