<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sonic Tonic Collective. Amsterdam DJs and music lovers. No genres. Just flow.">
  <meta name="theme-color" content="#0A0A0A">
  <title>Sonic Tonic Collective</title>
  <link rel="icon" href="/brand/stc-symbol.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Genos";
      src: url("/brand/genos.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --black: #0A0A0A;
      --white: #FFFFFF;
      --line: rgba(255, 255, 255, 0.28);
      --muted: rgba(255, 255, 255, 0.68);
      font-family: "Genos", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--black); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: radial-gradient(circle at center, rgba(255,255,255,.08) 0 1px, transparent 1.2px) 0 0 / 8px 8px, var(--black);
      color: var(--white);
      animation: field-drift 48s linear infinite;
    }
    a { color: inherit; }
    .shell {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: min(100%, 96rem);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(1.25rem, 3vw, 3rem);
    }
    .mark {
      position: absolute;
      z-index: -1;
      top: 5%;
      left: 50%;
      width: min(60vw, 39rem);
      min-width: 18rem;
      opacity: .12;
      transform: translateX(-50%);
      pointer-events: none;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
    }
    .logo { display: block; width: clamp(7rem, 10vw, 10rem); height: auto; }
    .context {
      max-width: 20rem;
      margin: 0;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.25;
      text-align: right;
    }
    .context span { color: var(--muted); }
    main {
      display: grid;
      flex: 1;
      align-content: center;
      justify-items: center;
      width: 100%;
      padding: clamp(4rem, 9vh, 8rem) 0 clamp(3rem, 7vh, 6rem);
    }
    h1 {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      font-size: clamp(4.6rem, 13vw, 12.5rem);
      font-weight: 100;
      letter-spacing: -0.045em;
      line-height: .72;
      text-align: center;
      text-transform: uppercase;
      animation: content-in 900ms cubic-bezier(.2,.7,.2,1) both;
    }
    h1 strong { display: block; font-weight: 900; }
    .links {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
      margin-top: clamp(3.5rem, 8vh, 7rem);
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      animation: content-in 900ms 140ms cubic-bezier(.2,.7,.2,1) both;
    }
    .link {
      position: relative;
      min-height: 8.5rem;
      padding: 1.15rem;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease;
    }
    .link small {
      display: block;
      margin-bottom: 2.5rem;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      letter-spacing: .14em;
    }
    .link span {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      font-size: clamp(1.25rem, 2vw, 1.75rem);
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
    }
    .link b {
      font-size: 1.25em;
      font-weight: 300;
      transition: transform 160ms ease;
    }
    .link:hover, .link:focus-visible { background: var(--white); color: var(--black); outline: none; }
    .link:hover small, .link:focus-visible small { color: rgba(10,10,10,.66); }
    .link:hover b, .link:focus-visible b { transform: translate(.18rem, -.18rem); }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    @keyframes field-drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 32px 16px, 0 0; }
    }
    @keyframes content-in {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 1100px) {
      .links { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .shell { padding: 1.25rem; }
      .context { max-width: 12rem; font-size: .9rem; }
      .mark { top: 15%; width: 88vw; }
      h1 { font-size: clamp(4rem, 22vw, 7.5rem); line-height: .75; }
      .links { grid-template-columns: 1fr 1fr; }
      .link { min-height: 7.5rem; }
      footer { flex-direction: column; gap: .4rem; }
    }
    @media (max-width: 420px) {
      .links { grid-template-columns: 1fr; }
      .link { min-height: auto; }
      .link small { margin-bottom: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <img class="mark" src="/brand/stc-symbol.svg" alt="" aria-hidden="true">
    <header>
      <img class="logo" src="/brand/stc-logo.svg" alt="Sonic Tonic Collective">
      <p class="context">Amsterdam DJs and music lovers.<br><span>Energy over genre.</span></p>
    </header>
    <main>
      <h1>No genres.<strong>Just flow.</strong></h1>
      <nav class="links" aria-label="Sonic Tonic Collective links">
        <a class="link" href="/signup" aria-label="Join community (opens in a new tab)" target="_blank" rel="noopener noreferrer"><small>01</small><span>Join community <b aria-hidden="true">↗</b></span></a>
        <a class="link" href="/tickets" aria-label="Upcoming events (opens in a new tab)" target="_blank" rel="noopener noreferrer"><small>02</small><span>Upcoming events <b aria-hidden="true">↗</b></span></a>
        <a class="link" href="/mixcloud" aria-label="Mixcloud (opens in a new tab)" target="_blank" rel="noopener noreferrer"><small>03</small><span>Mixcloud <b aria-hidden="true">↗</b></span></a>
        <a class="link" href="/instagram" aria-label="Instagram (opens in a new tab)" target="_blank" rel="noopener noreferrer"><small>04</small><span>Instagram <b aria-hidden="true">↗</b></span></a>
        <a class="link" href="/donate" aria-label="Donate (opens in a new tab)" target="_blank" rel="noopener noreferrer"><small>05</small><span>Donate <b aria-hidden="true">↗</b></span></a>
      </nav>
    </main>
    <footer><span>Sonic Tonic Collective</span><span>Amsterdam</span></footer>
  </div>
</body>
</html>
